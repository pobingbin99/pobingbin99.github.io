<!DOCTYPE html>
<html lang="en">

    <style>
        main article {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: auto;

            margin-top: 5px;
        }

        main article section img{
            width: 100%;
        }

        main article section button{
            padding: 5px;
            font-size: 15px;
            width: 80px;
            float: right;
        }
    </style>
</head>
<body>
<header>
    <nav>
        <ul>
            <li class="logo"><a href="index.html"><img src="images/logo.jpg" alt="로고입니다." ></a></li>

            <li><a href="login.html">로그인</a></li>
            <li><a href="register.html">회원가입</a></li>
        </ul> 
    </nav>
</header>
  
<div id="banner">지금 당신의 행복! IT's KOSTA Life!</div> 

<main>
    <article>
        <section class="main-item" data-main-item-id="10">
            <img src="https://picsum.photos/id/1/200" alt="">
            <h2>제목1 : main-item 1</h2>
            <p>내용1</p>
            <button class="main-item-btn">button 1</button>
        </section>
      
        <section class="main-item" data-main-item-id="10">
            <img src="https://picsum.photos/id/2/200" alt="">
            <h2>제목2 : main-item 2</h2>
            <p>내용2</p>
            <button class="main-item-btn">button 2</button>
        </section>
      
        <section class="main-item" data-main-item-id="10">
            <img src="https://picsum.photos/id/3/200" alt="">
            <h2>제목3  : main-item 3</h2>
            <p>내용3.</p>
            <button class="main-item-btn">button 3</button>
        </section>
    </article>
</main>
      
<footer>
    <ul>
        <li>경기도 성남시 오리역 한국소프트웨어진흥협회</li>
        <li>02-0000-0000</li>
    </ul>
</footer>

<script>
    onload = () => {
        // 배너 문구 5초마다 변경
        const bannerList = [
            "국민의 은행이 되겠습니다.",
            "5060 웰컴패키지, 최대 7만원 혜택을 드립니다.",
            "타행이체, 자동이체 수수료 면제",
            "저녁 6시까지 영업합니다."
        ];

        const banner = document.getElementById("banner");
        let index = 0;

        setInterval(() => {
            banner.innerText = bannerList[index++];
            if (index >= bannerList.length) index = 0;
        }, 5000);

        // 버튼 클릭 시 부모의 data-main-item-id 출력
        document.querySelectorAll(".main-item-btn").forEach((button) => {
            button.addEventListener("click", (e) => {
                const parent = e.target.parentElement;
                console.log(parent.dataset.mainItemId);
            });
        });
    };
</script>
</body>
